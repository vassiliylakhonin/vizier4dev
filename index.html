<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vizier4Dev — programme reporting workspace</title>
<meta name="description" content="Vizier4Dev demo: a queue-driven workspace for grant-funded programmes — sources, framework, collection, reporting, signals and funding. Fictional data." />
<style>
:root{
  --ink:#191A20; --ink-2:#3D4049; --muted:#6B7080; --faint:#9AA0AE;
  --canvas:#F1F2F5; --paper:#FFFFFF; --line:#E1E3EA; --line-2:#EEF0F4;
  --accent:#4B3FA8; --accent-2:#6C5FD0; --accent-soft:#EFEDFB;
  --bad:#B3261E; --bad-bg:#FCF1F0; --bad-line:#EEC0BC;
  --warn:#8A5A00; --warn-bg:#FDF8EC; --warn-line:#E8D2A0;
  --good:#1B6E3C; --good-bg:#EFF7F1; --good-line:#B3D7C0;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;background:none;border:none;padding:0;}
mark{background:#F6E7A8;padding:0 2px;}
.mono{font-family:var(--mono);}

/* ---------------- chrome: top bar, command bar, tab strip ---------------- */
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:9px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.wordmark{font-family:var(--serif);font-size:19px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:5px;}
.wordmark i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.06em;background:var(--accent);color:#fff;border-radius:3px;padding:2px 5px;position:relative;top:-2px;}
.proj{border-left:1px solid var(--line);padding-left:14px;min-width:0;}
.proj b{font-size:13px;}
.proj span{display:block;font-size:11px;color:var(--muted);}
.grow{flex:1;}
.cmd{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:4px;padding:5px 9px;background:#FAFAFC;min-width:min(320px,100%);}
.cmd input{border:none;background:none;outline:none;width:100%;font-size:13px;}
.cmd .k{font-family:var(--mono);font-size:9.5px;color:var(--faint);border:1px solid var(--line);border-radius:3px;padding:1px 4px;}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.seg button{padding:5px 10px;font-size:12px;color:var(--muted);border-right:1px solid var(--line);white-space:nowrap;}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--ink);color:#fff;}
.tbtn{border:1px solid var(--line);border-radius:4px;padding:5px 10px;font-size:12px;color:var(--muted);}
.tbtn:hover{border-color:var(--accent);color:var(--accent);}

.tabs{background:var(--paper);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;overflow-x:auto;position:sticky;top:0;z-index:30;}
.tab{padding:10px 14px 9px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--ink);font-weight:650;border-bottom-color:var(--accent);}
.tab .cnt{font-family:var(--mono);font-size:9.5px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 5px;}
.tab .cnt.q{background:var(--line);color:var(--muted);}

/* ---------------- body: queue + work surface ---------------- */
.wrap{display:flex;gap:18px;padding:18px 20px 70px;align-items:flex-start;max-width:1440px;}
.queue{width:290px;flex:none;position:sticky;top:56px;}
.surface{flex:1;min-width:0;}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;}
.qhead{padding:11px 13px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.qhead b{font-size:12.5px;}
.qitem{display:block;width:100%;text-align:left;padding:10px 13px;border-bottom:1px solid var(--line-2);}
.qitem:hover{background:#FAFAFC;}
.qitem:last-child{border-bottom:none;}
.qitem .t{font-size:12.5px;font-weight:600;display:flex;gap:6px;align-items:flex-start;}
.qitem .d{font-size:11.5px;color:var(--muted);margin-top:2px;}
.dot{width:6px;height:6px;border-radius:99px;flex:none;margin-top:6px;}
.dot.red{background:var(--bad);} .dot.amber{background:#C9922B;} .dot.blue{background:var(--accent-2);} .dot.green{background:var(--good);}
.qempty{padding:16px 13px;font-size:12.5px;color:var(--muted);}

/* ---------------- primitives ---------------- */
h1.page{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em;margin:0;}
.page-sub{color:var(--muted);font-size:13px;margin:5px 0 0;max-width:76ch;}
.pagehead{margin-bottom:18px;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px;}
.panel+.panel{margin-top:14px;}
.panel h2{font-family:var(--serif);font-size:16px;font-weight:600;margin:0 0 11px;}
.rule{height:1px;background:var(--line);margin:14px -18px;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:repeat(2,minmax(0,1fr));}
.g3{grid-template-columns:repeat(3,minmax(0,1fr));}
.lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;}
.btn{border-radius:4px;padding:7px 13px;font-size:13px;font-weight:600;background:var(--accent);color:#fff;border:1px solid var(--accent);}
.btn:hover{background:#3F349A;}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line);}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn.sm{padding:4px 9px;font-size:12px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:2px;padding:2px 6px;border:1px solid var(--line);color:var(--muted);background:#FAFAFC;}
.tag.good{color:var(--good);background:var(--good-bg);border-color:var(--good-line);}
.tag.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line);}
.tag.bad{color:var(--bad);background:var(--bad-bg);border-color:var(--bad-line);}
.tag.acc{color:var(--accent);background:var(--accent-soft);border-color:#CFC9F2;}
.src{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:10px;border-bottom:1px dotted var(--accent-2);color:var(--accent);cursor:pointer;padding-bottom:1px;}
.src:hover{background:var(--accent-soft);}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:0 10px 7px 0;border-bottom:1px solid var(--line);font-weight:700;}
td{padding:8px 10px 8px 0;border-bottom:1px solid var(--line-2);vertical-align:top;font-size:13px;}
.field{width:100%;border:1px solid var(--line);border-radius:4px;padding:7px 9px;font-size:13px;background:#fff;}
.field:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
.note{border-left:2px solid var(--accent-2);background:var(--accent-soft);padding:10px 12px;font-size:12.5px;}
.locked{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:11px 13px;font-size:13px;margin-bottom:14px;}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:15px;}
.stat .v{font-family:var(--serif);font-size:29px;letter-spacing:-.02em;}
.stat .k{font-size:12.5px;color:var(--muted);}
.stat .s{font-size:11px;color:var(--faint);}
.flagline{font-size:11.5px;margin-top:4px;display:flex;gap:5px;align-items:flex-start;}
.flagline.red{color:var(--bad);} .flagline.amber{color:var(--warn);} .flagline.green{color:var(--good);}
.bar{height:6px;background:#E5E7EC;border-radius:99px;overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--accent-2);transition:width .9s cubic-bezier(.4,0,.2,1);}
.insight{background:var(--ink);color:#D9DBE2;border-radius:4px;padding:16px;}
.insight .h{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;color:#A99CF0;margin-bottom:6px;}
.item{border:1px solid var(--line);border-radius:4px;padding:12px;background:#fff;}
.item+.item{margin-top:9px;}
.dz{border:1px dashed var(--accent-2);background:var(--accent-soft);border-radius:4px;padding:36px 20px;text-align:center;cursor:pointer;}
.dz:hover{background:#E6E3F8;}
.docrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:9px 11px;background:#fff;cursor:pointer;}
.docrow:hover{border-color:var(--accent);}
.docrow .ext{font-family:var(--mono);font-size:9px;font-weight:700;background:var(--ink);color:#fff;border-radius:2px;padding:2px 5px;}
.frow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:6px 9px;background:#fff;}
.frow+.frow{margin-top:6px;}
.frow.dragging{opacity:.35;}
.frow.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.handle{cursor:grab;color:var(--faint);font-family:var(--mono);}
.sec{border:1px solid var(--line);border-radius:4px;background:#FAFAFC;padding:14px;}
.sec+.sec{margin-top:11px;}
.doc-body{white-space:pre-wrap;font-family:var(--mono);font-size:12px;line-height:1.65;background:#FAFAFC;border:1px solid var(--line);border-radius:4px;padding:14px;max-height:56vh;overflow:auto;}
.modal-wrap{position:fixed;inset:0;background:rgba(25,26,32,.5);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px;}
.modal{background:#fff;border-radius:4px;padding:22px;width:100%;box-shadow:0 24px 60px rgba(25,26,32,.28);}
#drawer{position:fixed;right:0;top:0;bottom:0;width:min(440px,94vw);background:#fff;border-left:1px solid var(--line);box-shadow:-16px 0 44px rgba(25,26,32,.14);z-index:85;padding:20px;overflow:auto;}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 15px;border-radius:4px;font-size:13px;z-index:95;max-width:min(620px,92vw);box-shadow:0 10px 30px rgba(0,0,0,.22);}
#coach{position:fixed;right:22px;bottom:22px;z-index:80;max-width:330px;background:var(--ink);color:#E4E6EC;border-radius:4px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.3);}
#coach .step{font-family:var(--mono);font-size:9.5px;color:#A99CF0;letter-spacing:.15em;margin-bottom:6px;}
.hidden{display:none !important;}
.fade{animation:fade .26s cubic-bezier(.4,0,.2,1);}
@keyframes fade{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
.small{font-size:11.5px;color:var(--muted);}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:12px;color:var(--muted);background:#fff;}
.chip:hover{border-color:var(--accent);color:var(--accent);}
.subnav{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.subnav button{padding:0 0 8px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
.subnav button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:650;}
@media(max-width:1040px){
  .wrap{flex-direction:column;}
  .queue{width:100%;position:static;}
  .g2,.g3{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="top">
  <div class="wordmark">Vizier<i>4dev</i></div>
  <div class="proj"><b>Cold Chain for Rural Clinics</b><span id="projline">€3.8M · EU / DG INTPA · 4-partner consortium · Q1 reporting period</span></div>
  <div class="grow"></div>
  <div class="cmd"><span class="small">?</span><input id="cmd" placeholder="Ask this programme anything…" onkeydown="if(event.key==='Enter')ask()"/><span class="k">↵</span></div>
  <div class="seg" id="personas">
    <button id="p-lead" class="active" onclick="setPersona('lead')">Lead</button>
    <button id="p-partner" onclick="setPersona('partner')">Partner</button>
    <button id="p-mel" onclick="setPersona('mel')">MEL reviewer</button>
  </div>
  <div class="seg"><button id="lang-en" onclick="setLang('en')">EN</button><button id="lang-ru" onclick="setLang('ru')">RU</button></div>
  <button class="tbtn" id="b-tour" onclick="startTour()">Tour</button>
  <button class="tbtn" id="b-reset" onclick="resetDemo()">Reset</button>
</div>
<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div class="queue"><div class="qcard">
    <div class="qhead"><b id="qtitle">What needs you</b><span class="grow"></span><span class="tag" id="qcount">0</span></div>
    <div id="qlist"></div>
  </div>
  <div class="small" style="margin-top:9px" id="qnote">The queue is built from the donor’s rules and the current state of the reporting period. It changes with your role.</div>
  </div>
  <div class="surface" id="surface"></div>
</div>

<div id="toast" class="hidden"></div>
<div id="coach" class="hidden"></div>

<script>
/* ==========================================================================
   Vizier4Dev — single-file demo. Fictional programme, fictional figures.
   Structure: six workspaces + a role-aware work queue + a command bar.
   ========================================================================== */

/* ------------------------------ sources -------------------------------- */
const SRC={
 call:{name:'Call for proposals — INTPA/TER/2025/04.pdf',type:'PDF',size:'1.1 MB',text:
`EUROPEAN UNION — DG INTPA
CALL FOR PROPOSALS INTPA/TER/2025/04
Resilient primary health services — Terrace Province

LOT 2: Immunisation cold chain and last-mile delivery.
Indicative envelope: EUR 3,800,000 over 24 months.

ELIGIBILITY
Consortia of at least three partners, of which at least two nationally registered.
A lead applicant assumes financial and narrative reporting responsibility.

MANDATORY REQUIREMENTS
A results framework with SMART indicators, baselines and targets.
A functioning complaints and feedback mechanism accessible to end users.
Disaggregated targeting and reporting for all person-level indicators.
Safeguarding and child-protection policies in force at every partner.`},

 prop:{name:'Cold Chain for Rural Clinics — full proposal.docx',type:'DOCX',size:'2.9 MB',text:
`NORTHWIND ALLIANCE — FULL PROPOSAL
Action: Cold Chain for Rural Clinics
Lead applicant: Northwind Alliance
Partners: Terrace Health Trust (THT), Riverbend Community Care (RCC), Summit Logistics Cooperative (SLC)

OVERALL OBJECTIVE
Vaccines reach every rural clinic in Terrace Province intact, on time and at a temperature that can be proven.

SPECIFIC OBJECTIVES
SO1 Cold chain equipment installed and maintained at 240 rural clinics.
SO2 Last-mile delivery routes operating on a predictable schedule.
SO3 Clinic staff trained and certified in cold chain handling.

LOCALISATION
54% of the budget is implemented by nationally registered partners.

TRACK RECORD
Previous action (2022-2024): 186 clinics equipped, 96% temperature-excursion detection rate,
feedback mechanism response rate 91%.`},

 logf:{name:'Results framework.xlsx',type:'XLSX',size:'420 KB',text:
`RESULTS FRAMEWORK — COLD CHAIN FOR RURAL CLINICS

OC1.1 - Vaccine potency at point of use
  Baseline 82% · Target >=97% · Source: temperature-logger export + clinic audit

OP1.1 - Clinics with functioning cold chain equipment
  Baseline 0 · Target 240 · Lead: THT

OP1.3 - Clinic maintenance teams operating
  Baseline 0 · Target 18 teams · at least 40% female membership · Lead: THT

OP2.1 - Deliveries completed within the scheduled window
  Baseline - · Target 4,800 deliveries · Lead: SLC

OC2.2 - Health workers reporting confidence in the cold chain
  Baseline 38% · Target >=75% · perception survey, numerator and denominator required

OP3.1 - Health workers trained and certified
  Baseline - · Target 3,600 people · Lead: RCC/THT
  DISAGGREGATE: sex, age band, disability

CC1 - Feedback response rate
  Baseline - · Target >=85% within 14 days · Lead: RCC

CC2 - Inclusive reach of the feedback mechanism
  Target: at least 40% of feedback from women and health workers with disability`},

 budg:{name:'Budget and phasing.xlsx',type:'XLSX',size:'190 KB',text:
`BUDGET BY HEADING (EUR)
Cold chain equipment            1,102,000
Last-mile transport & fuel        836,000
Human resources                   798,000
Training & certification          418,000
Maintenance & spare parts         266,000
MEL, audits and assessments       190,000
Feedback mechanism & outreach     114,000
Visibility and reporting           76,000

QUARTERLY PHASING
Q1 380,000 · Q2 532,000 · Q3 608,000 · Q4 570,000

REPORTING RULE
Explain any heading deviation above 10% in the narrative report.`},

 guide:{name:'Donor reporting guidelines.pdf',type:'PDF',size:'760 KB',text:
`REPORTING GUIDELINES — DG INTPA

TIMING
Partner -> Lead: quarterly, within 15 working days of quarter end.
Lead -> Donor: quarterly consolidated report, within 30 working days.

QUALITY BAR
All "people" indicators MUST be disaggregated by sex, age band and disability.
Report numerator AND denominator for every percentage. A bare percentage is rejected.
Each figure must reference its means of verification, with evidence attached.
Explain any heading deviation above 10%.
The narrative report MUST contain a safeguarding subsection. A nil return is acceptable
only if signed by the responsible officer.`},

 rcclog:{name:'RCC Q1 training logs.xlsx',type:'XLSX',size:'96 KB',text:
`RIVERBEND COMMUNITY CARE — Q1 TRAINING AND CERTIFICATION LOGS

Certified health workers (consolidated, DEDUPLICATED): 812
  Female 470 · Male 342 · Under-30 214 · Health workers with disability 61

Session sign-in sheet raw total (NOT deduplicated): 1,140
  ^ This total double-counts staff who attended more than one session.
  The figure to report is the deduplicated certified count: 812.`},
};

/* ------------------------------ model ---------------------------------- */
const INDICATORS=[
 {code:'OC1.1',label:'Vaccine potency at point of use',unit:'%',base:'82',target:'≥97',lead:'THT',need:'Numerator + denominator + logger export',anchor:'OC1.1 - Vaccine potency at point of use'},
 {code:'OP1.1',label:'Clinics with functioning equipment',unit:'clinics',base:'0',target:'240',lead:'THT',need:'Count + means of verification',anchor:'OP1.1 - Clinics with functioning cold chain equipment'},
 {code:'OP1.3',label:'Clinic maintenance teams operating',unit:'teams',base:'0',target:'18',lead:'THT',need:'Count + % female membership (≥40%)',anchor:'OP1.3 - Clinic maintenance teams operating'},
 {code:'OP2.1',label:'Deliveries inside the scheduled window',unit:'deliveries',base:'-',target:'4,800',lead:'SLC',need:'Count + dispatch records',anchor:'OP2.1 - Deliveries completed within the scheduled window'},
 {code:'OC2.2',label:'Health workers confident in the cold chain',unit:'%',base:'38',target:'≥75',lead:'RCC',need:'Numerator + denominator + survey note',anchor:'OC2.2 - Health workers reporting confidence in the cold chain'},
 {code:'OP3.1',label:'Health workers trained and certified',unit:'people',base:'-',target:'3,600',lead:'RCC/THT',need:'Disaggregate by sex / age / disability',anchor:'OP3.1 - Health workers trained and certified'},
 {code:'CC1',label:'Feedback response rate',unit:'%',base:'-',target:'≥85',lead:'RCC',need:'Numerator + denominator + MoV',anchor:'CC1 - Feedback response rate'},
];
const RULES=[
 {t:'Quarterly partner returns',d:'Within 15 working days of quarter end',anchor:'Partner -> Lead: quarterly'},
 {t:'Disaggregation is mandatory',d:'Sex, age band and disability on every person-level indicator',anchor:'All "people" indicators MUST be disaggregated'},
 {t:'No bare percentages',d:'Numerator and denominator required, or the figure is rejected',anchor:'Report numerator AND denominator'},
 {t:'Evidence behind every figure',d:'Means of verification named and attached',anchor:'Each figure must reference its means of verification'},
 {t:'Explain >10% budget deviation',d:'Per heading, inside the narrative report',anchor:'Explain any heading deviation above 10%'},
 {t:'Safeguarding subsection',d:'Mandatory; a nil return must be signed',anchor:'The narrative report MUST contain a safeguarding subsection'},
];
const BUDGET=[
 {h:'Cold chain equipment',b:1102000,q1p:132000,q1a:104000},
 {h:'Last-mile transport & fuel',b:836000,q1p:96000,q1a:99000},
 {h:'Human resources',b:798000,q1p:88000,q1a:86000},
 {h:'Training & certification',b:418000,q1p:34000,q1a:38000},
 {h:'Maintenance & spare parts',b:266000,q1p:14000,q1a:9000},
 {h:'MEL, audits and assessments',b:190000,q1p:9000,q1a:8000},
 {h:'Feedback mechanism & outreach',b:114000,q1p:5000,q1a:5000},
 {h:'Visibility and reporting',b:76000,q1p:2000,q1a:2000},
];
/* Cost lines for the partner's Q1 financial return. `have` = evidence already on file.
   Thresholds below are the programme's own procurement rule, carried from the grant agreement. */
const PROC_THRESHOLD=10000;
const PERIOD={from:'2026-01-01',to:'2026-03-31',label:'Q1 2026'};
function defaultCosts(){return [
 {id:'C-101',h:'Human resources',d:'MEL officer — 0.6 FTE, January to March',a:14200,t:'staff',date:'2026-03-31',link:'',have:['invoice','payroll']},
 {id:'C-102',h:'Human resources',d:'Community mobilisers ×6 — Q1 field work',a:21800,t:'staff',date:'2026-03-31',link:'OP3.1',have:['invoice','payroll','timesheet'],mismatch:true},
 {id:'C-103',h:'Training & certification',d:'Certification workshops ×14 — venue, catering, materials',a:18600,t:'procure',date:'2026-02-18',link:'OP3.1',have:['invoice','contract','quotes']},
 {id:'C-104',h:'Cold chain equipment',d:'Spare parts and logger batteries — bulk order',a:12400,t:'procure',date:'2026-03-04',link:'OP1.3',have:['invoice']},
 {id:'C-105',h:'Feedback mechanism & outreach',d:'Toll-free line and drop-in desk staffing',a:4900,t:'procure',date:'2026-02-27',link:'CC1',have:['invoice','contract']},
 {id:'C-106',h:'Human resources',d:'Quarter-end performance bonus, project staff',a:3100,t:'bonus',date:'2026-03-31',link:'',have:['invoice','payroll']},
 {id:'C-107',h:'Last-mile transport & fuel',d:'Fuel for the northern route, March',a:6300,t:'procure',date:'2026-04-06',link:'OP2.1',have:['invoice']},
];}
let COSTS=defaultCosts();
const DOCNAMES={invoice:'Invoice & proof of payment',timesheet:'Signed timesheet',payroll:'Payroll record',contract:'Signed contract',quotes:'Comparison of offers'};
/* Append-only record of who changed what — this is the audit trail the auditor asks for. */
let LEDGER=[];
function logEvent(what,detail){LEDGER.unshift({at:new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}),by:roleName(),what,detail});}

/* Illustrative mapping targets. The live product loads the donor's current official list;

function esc(s){return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function attr(s){return esc(s).replace(/'/g,'&#39;');}
function eur(n){return '€'+n.toLocaleString('en-GB');}
function fmt(n){return n.toLocaleString('en-GB');}
function num(x){return parseInt((x||'').toString().replace(/[^0-9]/g,''))||0;}
function can(a){return S.persona!=='partner';}

function panel(i,c=''){return `<div class="panel ${c}">${i}</div>`;}
function locked(m,ws,sub,label){return `<div class="locked">${m}</div>`+(ws?`<button class="btn" onclick="go('${ws}'${sub?",'"+sub+"'":''})">${label}</button>`:'');}
function src(doc,anchor,label){return `<span class="src" onclick="openSource('${doc}','${attr(anchor||'')}')">${esc(label||SRC[doc].name)}</span>`;}
function stat(k,v,s){return `<div class="stat"><div class="v">${v}</div><div class="k">${k}</div><div class="s">${s||''}</div></div>`;}
function insight(t,b,act){return `<div class="insight"><div class="h">${t}</div><div>${b}</div>${act?`<div style="margin-top:11px"><button class="btn sm" onclick="toast('Added to your actions for this quarter.')">${act}</button></div>`:''}</div>`;}
function modal(html,w='560px'){const d=document.createElement('div');d.className='modal-wrap';d.onclick=e=>{if(e.target===d)d.remove();};
 d.innerHTML=localize(`<div class="modal" style="max-width:${w}">${html}<div style="text-align:right;margin-top:16px"><button class="btn" onclick="this.closest('.modal-wrap').remove()">Close</button></div></div>`);
 document.body.appendChild(d);return d;}
function openSource(docId,anchor){
 const d=SRC[docId];if(!d)return;let body=esc(d.text);
 if(anchor){const a=esc(anchor);const i=body.indexOf(a);if(i>=0)body=body.slice(0,i)+'<mark id="hl">'+body.slice(i,i+a.length)+'</mark>'+body.slice(i+a.length);}
 modal(`<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><span class="tag">${d.type}</span><b>${esc(d.name)}</b></div>
  <div class="doc-body">${body}</div><div class="small" style="margin-top:8px">In the live product this opens the original file at the highlighted line.</div>`,'760px');
 setTimeout(()=>{const h=document.getElementById('hl');if(h)h.scrollIntoView({block:'center'});},60);
}

function queue(){
 const q=[];
 const add=(sev,t,d,ws,sub)=>q.push({sev,t,d,ws,sub});
 if(!S.ingested){add('blue','Add the project documents','Nothing is indexed yet — the queue stays empty until it can read the rules.','sources');return q;}
 if(TPL.status!=='active'&&can()) add('blue','Approve the reporting template','Partners cannot file until the template is live.','framework','template');
 if(S.persona==='partner'){
  if(TPL.status!=='active') add('amber','Waiting on the lead','The Q1 template has not been activated yet.','framework','template');
  else{
   if(!S.conflictDone) add('red','Two of your sources disagree','OP3.1 total: 812 in the register against 1,140 on the sign-in sheets.','collect','returns');
   const v=validate(), reds=v.filter(f=>f.sev==='red'), ambers=v.filter(f=>f.sev==='amber');
   if(reds.length>3) add('red',reds.length+' required figures still empty','Draft from your files first, then fix what is left by hand.','collect','returns');
   else reds.forEach(f=>add('red',f.field,f.msg,'collect','returns'));
   ambers.slice(0,3).forEach(f=>add('amber',f.field,f.msg,'collect','returns'));
   if(!S.submitted&&!v.length) add('green','Your return is ready to submit','All donor checks pass.','collect','returns');
   const risky=COSTS.filter(c=>costFlags(c).some(x=>x.sev==='red'));
   if(risky.length>3) add('red',eur(risky.reduce((a,c)=>a+c.a,0))+' of costs at risk',risky.length+' lines are missing the evidence an auditor asks for.','collect','costs');
   else risky.forEach(c=>add('red',c.id+' — '+eur(c.a)+' at risk',costFlags(c).find(x=>x.sev==='red').m,'collect','costs'));
  }
 }else{
  if(TPL.status==='active'){
   PARTNERS.forEach(p=>{if(!APPROVED[p]) add('amber','Review '+p,(AI_REVIEW[p]||[]).filter(i=>i.sev!=='good').length+' point(s) worth a human decision.','collect','review');});
   if(PARTNERS.every(p=>APPROVED[p])&&!S.consolidated) add('blue','Consolidate the Q1 report','All three returns are approved.','report','consolidated');
   const t=costTotals();
   if(t.atRisk) add('red',eur(t.atRisk)+' would not survive an audit',COSTS.filter(c=>costFlags(c).some(x=>x.sev==='red')).length+' cost line(s) with a blocking evidence gap.','report','financial');
   const unmapped=Object.entries(MAPPING).filter(([k,v])=>!v).length;
   if(S.consolidated&&unmapped) add('amber',unmapped+' indicators not mapped for the donor system','The results system will not accept an unmapped indicator.','report','consolidated');
  }
  NARRATIVE.sections.forEach(s=>{const r=s.flags.filter(f=>f.s==='red');
   if(r.length) add('red',s.t.replace(/^\d+\.\s*/,''),r[0].m,'report','narrative');});
 }
 add('amber','INTPA second phase closes in 21 days','Fit 91% — the strongest match in your pipeline.','funding');
 return q;
}

const RX=[

const ENT={'&amp;':'&','&quot;':'"','&#39;':"'",'&lt;':'<','&gt;':'>'};
function deent(s){return s.replace(/&(?:amp|quot|#39|lt|gt);/g,m=>ENT[m]);}
const NORM=s=>s.replace(/\s+/g,' ').trim();
const DICT_N={};Object.keys(DICT).forEach(k=>{DICT_N[NORM(k)]=DICT[k];});
function L(s){
 if(LANG!=='ru')return s;
 const raw=deent((s+'').trim());
 if(DICT[raw])return DICT[raw];
 const k=NORM(raw);
 if(DICT_N[k])return DICT_N[k];
 for(const [re,fn] of RX){const m=k.match(re);if(m)return fn(m);}
 return s;
}
/* Only text between tags and placeholder attributes are touched, so inline
   handlers and markup cannot be corrupted by a translation. */
function localize(html){
 if(LANG!=='ru')return html;
 return (html+'')
  .replace(/>([^<]+)</g,(m,txt)=>{
    const core=txt.trim();if(!core)return m;
    const out=L(core);if(out===core)return m;
    return '>'+txt.match(/^\s*/)[0]+out+txt.match(/\s*$/)[0]+'<';})
  .replace(/placeholder="([^"]*)"/g,(m,p)=>'placeholder="'+(L(p)+'').replace(/"/g,'&quot;')+'"');
}

function sectionHTML(s,si,ed){

   <div style="flex:1;min-width:0"><div style="font-weight:700">${esc(s.title)}</div>

        <button class="btn ghost sm" onclick="delSection(${si})">✕</button>`:''}</div>
  <div style="margin-top:11px">${s.fields.map((f,fi)=>fieldHTML(f,si,fi,ed)).join('')}</div>

function fieldHTML(f,si,fi,ed){
 if(!ed)return `<div class="frow"><span style="flex:1">${esc(f.l)}</span><span class="tag">${FTYPES[f.t]}</span>${f.req?'<span class="tag bad">required</span>':''}</div>`;
 return `<div class="frow" draggable="true" ondragstart="dragStart(event,${si},${fi})" ondragend="dragEnd(event)"
   ondragover="dragOver(event,this)" ondragleave="this.classList.remove('over')" ondrop="dropField(event,${si},${fi})">
   <span class="handle">⠿</span><input class="field" style="flex:1" value="${esc(f.l)}" oninput="setLabel(${si},${fi},this.value)"/>
   <select class="field" style="width:150px" onchange="setType(${si},${fi},this.value)">

   <button class="tag ${f.req?'bad':''}" onclick="toggleReq(${si},${fi})">${f.req?'required':'optional'}</button>
   <button class="handle" onclick="moveField(${si},${fi},-1)" title="Move up">↑</button>
   <button class="handle" onclick="moveField(${si},${fi},1)" title="Move down">↓</button>
   <button class="handle" onclick="delField(${si},${fi})">✕</button></div>`;

function refreshBuilder(){const b=document.getElementById('builder');if(b)b.innerHTML=TPL.sections.map((s,i)=>sectionHTML(s,i,can())).join('');}
function setLabel(si,fi,v){TPL.sections[si].fields[fi].l=v;}
function setType(si,fi,v){TPL.sections[si].fields[fi].t=v;refreshBuilder();}
function toggleReq(si,fi){const f=TPL.sections[si].fields[fi];f.req=!f.req;refreshBuilder();}
function delField(si,fi){TPL.sections[si].fields.splice(fi,1);refreshBuilder();}
/* Same reorder as dragging, for anyone demoing on a trackpad or a touch screen. */
function moveField(si,fi,d){const a=TPL.sections[si].fields,j=fi+d;
 if(j<0||j>=a.length)return;[a[fi],a[j]]=[a[j],a[fi]];refreshBuilder();}
function addField(si){TPL.sections[si].fields.push({l:'New field',t:'text',req:false});refreshBuilder();toast('Field added — rename it and pick a type.');}
function delSection(si){if(confirm('Remove this indicator section?')){TPL.sections.splice(si,1);refreshBuilder();}}
function moveSection(si,d){const j=si+d;if(j<0||j>=TPL.sections.length)return;const a=TPL.sections;[a[si],a[j]]=[a[j],a[si]];refreshBuilder();}
function addSection(){
 const code=prompt('Add an indicator section. Type its code:\n\n'+INDICATORS.map(i=>i.code+' — '+i.label).join('\n'),'OP2.1');
 if(!code)return;const ind=INDICATORS.find(i=>i.code.toLowerCase()===code.trim().toLowerCase());
 TPL.sections.push({ind:ind?ind.code:code.trim().toUpperCase(),title:ind?ind.label:'New indicator',
  why:ind?('Needs: '+ind.need):'Define what to collect.',anchor:ind?ind.anchor:'',
  fields:[{l:'Value',t:'number',req:true},{l:'Means of verification',t:'text',req:true}]});
 refreshBuilder();toast('Section added.');
}
let DRAG=null;
function dragStart(e,si,fi){DRAG={si,fi};e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.frow.over').forEach(x=>x.classList.remove('over'));}
function dragOver(e,el){e.preventDefault();el.classList.add('over');}
function dropField(e,si,fi){e.preventDefault();if(!DRAG)return;if(DRAG.si!==si){DRAG=null;refreshBuilder();return;}
 const a=TPL.sections[si].fields;const [m]=a.splice(DRAG.fi,1);a.splice(fi,0,m);DRAG=null;refreshBuilder();}
function activateTpl(){TPL.status='active';render();toast('Form activated. It is now live to all three partners.');}

   <button class="btn" onclick="setPersona('partner')">View as the partner</button>
   <button class="btn ghost" style="margin-left:8px" onclick="go('collect','review')">Returns in review</button>`;
 if(TPL.status!=='active')return head('My return')+locked('The lead has not activated the Q1 form yet.','framework','template','See the form');
 const flags=validate();
 const red=flags.filter(f=>f.sev==='red').length, amber=flags.filter(f=>f.sev==='amber').length;
 const my=COMMENTS[ME];
 return head('Q1 return — Riverbend Community Care','Your figures are checked against the donor rules and against your own source files as you type.')
  +((my&&(my.overall||Object.keys(my.items||{}).length))?panel(`<h2>From your reviewer</h2>
     ${my.overall?`<div style="font-size:13px">${esc(my.overall)}</div>`:''}
     ${Object.entries(my.items||{}).map(([k,v])=>`<div class="small">· <b>${esc(k.split('::')[1])}</b> — ${esc(v)}</div>`).join('')}`,'', ):'')
  +panel(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div style="flex:1"><div class="lbl">Status</div><div style="font-weight:650">${S.submitted?'Submitted — with the reviewer':'Draft — due in 6 working days'}</div></div>
    <span class="tag ${red?'bad':'good'}">${red} blocking</span><span class="tag ${amber?'warn':''}">${amber} to verify</span>
    <button class="btn ghost sm" onclick="aiDraft()">Draft from my files</button>
    <button class="btn sm" onclick="submitReturn()">Submit</button></div>
   <div class="small" style="margin-top:7px">${esc(DRAFT_NOTE)}</div>`)
  +TPL.sections.map(s=>returnSection(s,flags)).join('');
};
function returnSection(s,flags){
 const sf=flags.filter(f=>f.ind===s.ind);
 return panel(`<div style="display:flex;gap:9px;align-items:center;margin-bottom:3px">
   <span class="tag acc mono">${esc(s.ind)}</span><b>${esc(s.title)}</b><span style="flex:1"></span>
   ${sf.length?`<span class="tag ${sf.some(f=>f.sev==='red')?'bad':'warn'}">${sf.length} flag${sf.length>1?'s':''}</span>`:'<span class="tag good">clean</span>'}</div>
  <div class="small" style="margin-bottom:11px">${esc(s.why)} ${src('guide',s.anchor,'rule')}</div>
  <div class="grid g2">${s.fields.map(f=>returnField(s.ind,f,sf.find(x=>x.field===f.l))).join('')}</div>
  ${(s.ind===CONFLICT.ind&&!S.conflictDone)?conflictBox():''}`);
}
function returnField(ind,f,flag){
 if(ind===CONFLICT.ind&&f.l===CONFLICT.field&&!S.conflictDone)return '';
 const v=(SUB[ind]&&SUB[ind][f.l]!==undefined)?SUB[ind][f.l]:'';
 const ver=(VERIFY[ind]&&VERIFY[ind][f.l])||'';
 const cm=(COMMENTS[ME]&&COMMENTS[ME].items&&COMMENTS[ME].items[ind+'::'+f.l])||'';
 const bc=flag?(flag.sev==='red'?'var(--bad-line)':'var(--warn-line)'):(ver==='ok'?'var(--good-line)':'var(--line)');
 const ctl=f.t==='longtext'
  ?`<textarea class="field" rows="3" style="border-color:${bc}" oninput="setVal('${ind}','${attr(f.l)}',this.value)">${esc(v)}</textarea>`
  :f.t==='file'
  ?`<button class="btn ghost sm" onclick="attachEvidence('${ind}','${attr(f.l)}')">${v?'✓ '+esc(v):'Attach evidence'}</button>`
  :`<input class="field" style="border-color:${bc}" value="${esc(v)}" oninput="setVal('${ind}','${attr(f.l)}',this.value)"/>`;
 return `<div style="${f.t==='longtext'?'grid-column:1/-1':''}">
  <div class="lbl" style="margin-bottom:4px">${esc(f.l)} ${f.req?'<span style="color:var(--bad)">*</span>':''}</div>${ctl}
  ${flag?`<div class="flagline ${flag.sev==='red'?'red':'amber'}"><span>${flag.sev==='red'?'✕':'!'}</span><span>${esc(flag.msg)}</span></div>`:''}
  ${!flag&&ver==='ok'?`<div class="flagline green"><span>✓</span><span>matches your Q1 source file</span></div>`:''}
  ${!flag&&ver==='check'?`<div class="flagline amber"><span>!</span><span>could not verify against a source — confirm it</span></div>`:''}
  ${cm?`<div class="flagline"><span>·</span><span>Reviewer: ${esc(cm)}</span></div>`:''}</div>`;
}
function conflictBox(){
 return `<div style="margin-top:12px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:4px;padding:13px">
  <div style="font-weight:700;color:var(--warn)">Two of your sources disagree on “${esc(CONFLICT.field)}”</div>
  <div class="small" style="margin:4px 0 10px">Both figures sit in your own files ${src('rcclog','Campaign','RCC Q1 training logs')}. Pick the one to report; the choice is recorded with its reason.</div>
  <div class="grid g2">${CONFLICT.options.map((o,i)=>`<button class="item" style="text-align:left" onclick="resolveConflict(${i})">
   <div class="mono" style="font-size:19px;font-weight:700">${esc(o.v)}</div><div class="small">${esc(o.note)}</div>
   <div style="margin-top:6px"><span class="tag ${o.ok?'good':'bad'}">${o.ok?'recommended — deduplicated':'double-counts repeat attendance'}</span></div></button>`).join('')}</div></div>`;
}
function resolveConflict(i){
 const o=CONFLICT.options[i];
 SUB[CONFLICT.ind]=SUB[CONFLICT.ind]||{};SUB[CONFLICT.ind][CONFLICT.field]=o.v;
 VERIFY[CONFLICT.ind]=VERIFY[CONFLICT.ind]||{};VERIFY[CONFLICT.ind][CONFLICT.field]=o.ok?'ok':'check';
 S.conflictDone=true;
 logEvent('Source conflict resolved','OP3.1 total set to '+o.v+' — '+o.note);
 render();
 toast(o.ok?'Recorded 812 from the deduplicated register, with the reason attached.'
           :'Recorded 1,140 from the raw sign-in sheet — flagged as double-counted for the reviewer.');
}
function setVal(ind,label,v){SUB[ind]=SUB[ind]||{};SUB[ind][label]=v;if(VERIFY[ind])VERIFY[ind][label]='';sched();}
let _rt=null;function sched(){clearTimeout(_rt);_rt=setTimeout(()=>{if(S.ws==='collect')render();},800);}
function attachEvidence(ind,label){SUB[ind]=SUB[ind]||{};SUB[ind][label]='certification-register-q1.xlsx';render();toast('Evidence attached and bound to the figure.');}
function aiDraft(){
 Object.entries(DRAFT).forEach(([ind,vals])=>{SUB[ind]=SUB[ind]||{};VERIFY[ind]=VERIFY[ind]||{};
  Object.entries(vals).forEach(([k,v])=>{SUB[ind][k]=v;VERIFY[ind][k]='ok';});});
 render();toast('Drafted from your Q1 files. One figure was left open because two of your own sources disagree.');
}
function validate(){
 const out=[];
 TPL.sections.forEach(s=>{
  const vals=SUB[s.ind]||{};
  s.fields.forEach(f=>{
   if(s.ind===CONFLICT.ind&&f.l===CONFLICT.field&&!S.conflictDone){out.push({ind:s.ind,field:f.l,sev:'red',msg:'Unresolved source conflict.'});return;}
   const v=(vals[f.l]||'').toString().trim();
   if(f.req&&!v)out.push({ind:s.ind,field:f.l,sev:'red',msg:'Required by the donor form.'});
  });
  const nf=s.fields.find(f=>/numerator/i.test(f.l)), df=s.fields.find(f=>/denominator/i.test(f.l));
  if(nf&&df){const n=num(vals[nf.l]),d=num(vals[df.l]);
   if(n&&d&&n>d)out.push({ind:s.ind,field:nf.l,sev:'red',msg:'Numerator is larger than the denominator.'});}
  if(s.ind==='OP3.1'){const tot=num(vals['Total certified (in-period)']),fm=num(vals['Female']),ml=num(vals['Male']);
   if(tot&&fm&&ml&&Math.abs(tot-(fm+ml))>1)out.push({ind:s.ind,field:'Female',sev:'amber',msg:'Female + male ('+fmt(fm+ml)+') does not reconcile with the total ('+fmt(tot)+').'});}
  if(s.ind==='OP1.3'){const p=num(vals['Female members (%)']);
   if(p&&p<40)out.push({ind:s.ind,field:'Female members (%)',sev:'amber',msg:'Below the 40% floor in the results framework.'});}
  if(s.ind===NARR_EXPECT.ind){const t=(vals['Narrative / barriers noted']||'').toLowerCase();
   if(t&&t.length<50)out.push({ind:s.ind,field:'Narrative / barriers noted',sev:'amber',msg:'Too short to be usable in the donor report.'});
   else if(t&&!NARR_EXPECT.words.some(w=>t.includes(w)))out.push({ind:s.ind,field:'Narrative / barriers noted',sev:'amber',msg:'Does not address '+NARR_EXPECT.topic+'.'});}
 });
 return out;
}
function submitReturn(){
 const f=validate(),red=f.filter(x=>x.sev==='red').length;
 if(red){toast('Cannot submit: '+red+' blocking issue'+(red>1?'s':'')+' left. The amber ones can travel with a note.');return;}
 S.submitted=true;logEvent('Return submitted',ME+' — '+f.length+' open flag(s)');render();
 toast('Return submitted'+(f.length?' with '+f.length+' open flag(s) the reviewer will see.':' — all donor checks pass.'));
 setTimeout(()=>setPersona('mel'),900);
}
VIEW.review=function(){
 if(S.persona==='partner')return head('Returns in review')+locked('Partners see only their own return.','collect','returns','Back to my return');
 if(S.reviewTarget)return reviewDetail();
 const rows=[{p:ME,note:S.submitted?'Submitted · '+validate().length+' open flag(s)':'Not submitted yet'},
             {p:'Terrace Health Trust',note:'Submitted · all indicators complete'},
             {p:'Summit Logistics Cooperative',note:'Submitted · 1 inclusion flag'}];
 const all=rows.every(r=>APPROVED[r.p]);
 return head('Returns in review','Three returns, already checked against the donor rules. What is left is judgement, not arithmetic.')
  +panel(`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <div style="flex:1"><div class="lbl">Q1</div><div style="font-family:var(--serif);font-size:16px">${rows.filter(r=>APPROVED[r.p]).length} of ${rows.length} approved</div></div>
    <button class="btn" onclick="consolidate()" ${all?'':'disabled'}>Consolidate the donor report</button></div>`)
  +rows.map(r=>panel(`<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div style="flex:1"><b>${esc(r.p)}</b><div class="small">${esc(r.note)}</div></div>
    ${APPROVED[r.p]?'<span class="tag good">approved</span>':'<span class="tag warn">awaiting review</span>'}
    <button class="btn ghost sm" onclick="openPartner('${attr(r.p)}')">Open</button>
    <button class="btn sm" onclick="approveP('${attr(r.p)}')" ${APPROVED[r.p]?'disabled':''}>Approve</button></div>
   <div style="margin-top:10px">${(AI_REVIEW[r.p]||[]).map(i=>`<div class="flagline ${i.sev==='good'?'green':'amber'}">
     <span>${i.sev==='good'?'✓':'!'}</span><span><b>${esc(i.t)}.</b> ${esc(i.d)}</span></div>`).join('')}</div>`)).join('');
};
function approveP(p){APPROVED[p]=true;logEvent('Return approved',p);render();toast(p+' approved.');}
function openPartner(p){S.reviewTarget=p;render();}
function closePartner(){S.reviewTarget='';render();}
function partnerValues(p){return p===ME?SUB:(OTHER_SUB[p]||{});}
function reviewDetail(){
 const p=S.reviewTarget,vals=partnerValues(p),c=COMMENTS[p]||{overall:'',items:{}};
 return head(esc(p)+' — Q1 return','Every figure carries its source. A comment on any line lands inside the partner’s own form.')
  +`<div style="margin-bottom:13px"><button class="btn ghost sm" onclick="closePartner()">← All returns</button></div>`
  +TPL.sections.map(s=>{const v=vals[s.ind]||{};
   return panel(`<div style="display:flex;gap:9px;align-items:center;margin-bottom:9px">
     <span class="tag acc mono">${esc(s.ind)}</span><b>${esc(s.title)}</b></div>
    <table><tbody>${s.fields.map(f=>{const key=s.ind+'::'+f.l,val=v[f.l];
      return `<tr><td style="width:45%">${esc(f.l)}</td>
       <td class="mono" style="font-weight:600">${val?esc(val):'<span class="tag bad">missing</span>'}</td>
       <td style="width:1%"><button class="btn ghost sm" onclick="addComment('${attr(p)}','${attr(key)}')">Comment</button></td></tr>
       ${c.items[key]?`<tr><td colspan="3" class="small" style="color:var(--accent)">· ${esc(c.items[key])}</td></tr>`:''}`;}).join('')}
    </tbody></table>`);}).join('')
  +panel(`<h2>Overall comment to ${esc(p)}</h2>
    <textarea class="field" rows="3" oninput="setOverall('${attr(p)}',this.value)" placeholder="What has to change before you approve?">${esc(c.overall||'')}</textarea>
    <div style="margin-top:11px;display:flex;gap:8px;flex-wrap:wrap">
     <button class="btn ghost" onclick="sendComments('${attr(p)}')">Send comments</button>
     <button class="btn" onclick="approveP('${attr(p)}');closePartner()">Approve this return</button></div>`);
}
function setOverall(p,v){COMMENTS[p]=COMMENTS[p]||{overall:'',items:{}};COMMENTS[p].overall=v;}
function addComment(p,key){const t=prompt('Comment for the partner on this line:');if(t==null||!t.trim())return;
 COMMENTS[p]=COMMENTS[p]||{overall:'',items:{}};COMMENTS[p].items[key]=t;render();}
function sendComments(p){const c=COMMENTS[p]||{items:{}};const n=Object.keys(c.items||{}).length+(c.overall?1:0);
 toast('Sent '+n+' comment'+(n===1?'':'s')+' to '+p+' — they appear against the exact line in their own form.');}
function consolidate(){S.consolidated=true;go('report','consolidated');toast('Consolidated. Every figure traces back to a partner return.');}

/* ============================ COSTS & AUDIT ============================= */
/* Every rule below mirrors a documented audit finding: personnel costs without reliable
   time tracking, procurement without a documented comparison, costs that cannot be tied
   to an output, bonuses linked solely to the action, and costs outside the period. */
function costFlags(c){
 const f=[];
 const has=d=>c.have.includes(d);
 if(!has('invoice')) f.push({sev:'red',m:'No invoice or proof of payment on file.',fix:'invoice'});
 if(c.t==='staff'){
  if(!has('timesheet')) f.push({sev:'red',m:'Personnel cost with no signed timesheet — the most frequent reason personnel costs are declared ineligible.',fix:'timesheet'});
  else if(c.mismatch) f.push({sev:'amber',m:'Timesheet hours do not reconcile with the payroll record for the same month.'});
  if(!has('payroll')) f.push({sev:'red',m:'No payroll record to support the declared salary cost.',fix:'payroll'});
 }
 if(c.t==='bonus') f.push({sev:'red',m:'A bonus linked solely to the funded action is not an eligible cost. Move it off the grant.',hard:true});
 if(c.t==='procure'){
  if(!has('contract')&&c.a>=PROC_THRESHOLD) f.push({sev:'red',m:'Above the €'+fmt(PROC_THRESHOLD)+' threshold with no signed contract.',fix:'contract'});
  if(!has('quotes')&&c.a>=PROC_THRESHOLD) f.push({sev:'red',m:'Above the €'+fmt(PROC_THRESHOLD)+' threshold with no documented comparison of offers.',fix:'quotes'});
 }
 if(c.date>PERIOD.to||c.date<PERIOD.from) f.push({sev:'red',m:'Dated outside '+PERIOD.label+' — it belongs to another reporting period.',hard:true});
 if(!c.link) f.push({sev:'amber',m:'Not linked to an output. An auditor will ask why this cost was necessary for the action.',fix:'link'});
 return f;
}
function costTotals(){
 let total=0,atRisk=0,clean=0;
 COSTS.forEach(c=>{const f=costFlags(c);total+=c.a;
  if(f.some(x=>x.sev==='red'))atRisk+=c.a;else if(!f.length)clean+=c.a;});
 return {total,atRisk,clean};
}
function attachDoc(id,doc){
 const c=COSTS.find(x=>x.id===id);if(!c||c.have.includes(doc))return;
 c.have.push(doc);if(doc==='timesheet')c.mismatch=false;
 logEvent('Evidence attached',DOCNAMES[doc]+' → '+id);
 render();toast(DOCNAMES[doc]+' attached to '+id+' and bound to the cost line.');
}
function linkCost(id){
 const c=COSTS.find(x=>x.id===id);if(!c)return;
 const code=prompt('Link '+id+' to an output:\n\n'+INDICATORS.map(i=>i.code+' — '+i.label).join('\n'),'OP3.1');
 if(!code)return;c.link=code.trim().toUpperCase();
 logEvent('Cost linked to an output',id+' → '+c.link);
 render();toast(id+' linked to '+c.link+'.');
}
function dropCost(id){
 const c=COSTS.find(x=>x.id===id);if(!c)return;
 if(!confirm('Move '+id+' ('+eur(c.a)+') off the grant? It stays in your own books, but leaves the claim.'))return;
 COSTS=COSTS.filter(x=>x.id!==id);
 logEvent('Cost removed from the claim',id+' — '+eur(c.a));
 render();toast(id+' removed from the Q1 claim. The reason is recorded in the audit trail.');
}
VIEW.costs=function(){
 if(TPL.status!=='active')return head('Costs')+locked('The lead has not opened the Q1 period yet.','framework','template','See the form');
 const t=costTotals();
 const mine=S.persona==='partner';
 return head('Q1 cost lines'+(mine?' — Riverbend Community Care':''),
   'Results tell the donor what happened; these lines are what gets audited. Each rule below is a documented reason costs are declared ineligible and clawed back.')
  +`<div class="grid g3" style="margin-bottom:14px">
    ${stat('Declared this period',eur(t.total),COSTS.length+' cost lines')}
    ${stat('At risk of rejection',eur(t.atRisk),t.atRisk?'blocking evidence gaps':'nothing blocking')}
    ${stat('Audit-ready',eur(t.clean),'complete evidence, linked to an output')}</div>`
  +COSTS.map(c=>{
   const f=costFlags(c),red=f.some(x=>x.sev==='red');
   const missing=f.filter(x=>x.fix&&x.fix!=='link').map(x=>x.fix);
   return `<div class="panel" style="border-color:${red?'var(--bad-line)':f.length?'var(--warn-line)':'var(--good-line)'}">
    <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">
     <span class="tag acc mono">${c.id}</span><b style="flex:1;min-width:180px">${esc(c.d)}</b>
     <span class="mono" style="font-weight:700">${eur(c.a)}</span>
     ${red?'<span class="tag bad">at risk</span>':f.length?'<span class="tag warn">to tidy</span>':'<span class="tag good">audit-ready</span>'}</div>
    <div class="small" style="margin-top:3px">${esc(c.h)} · ${esc(c.date)} · ${c.link?'linked to <b>'+esc(c.link)+'</b>':'not linked to an output'}</div>
    <div class="chiprow" style="margin-top:8px">${Object.keys(DOCNAMES).map(d=>{
      const need=(d==='invoice')||(c.t==='staff'&&(d==='timesheet'||d==='payroll'))||(c.t==='procure'&&c.a>=PROC_THRESHOLD&&(d==='contract'||d==='quotes'));
      if(!need&&!c.have.includes(d))return '';
      return `<span class="tag ${c.have.includes(d)?'good':'bad'}">${c.have.includes(d)?'✓':'missing'} ${DOCNAMES[d]}</span>`;}).join('')}</div>
    ${f.map(x=>`<div class="flagline ${x.sev==='red'?'red':'amber'}"><span>${x.sev==='red'?'✕':'!'}</span><span>${esc(x.m)}</span></div>`).join('')}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
     ${missing.map(d=>`<button class="btn ghost sm" onclick="attachDoc('${c.id}','${d}')">Attach ${DOCNAMES[d].toLowerCase()}</button>`).join('')}
     ${!c.link?`<button class="btn ghost sm" onclick="linkCost('${c.id}')">Link to an output</button>`:''}
     ${f.some(x=>x.hard)?`<button class="btn sm" onclick="dropCost('${c.id}')">Take off the claim</button>`:''}
    </div></div>`;}).join('')
  +panel(`<h2>Audit trail</h2><div class="small" style="margin-bottom:9px">Append-only. This is what an auditor asks for when a figure changes after submission.</div>
    ${LEDGER.length?LEDGER.map(l=>`<div class="flagline"><span class="mono small">${l.at}</span><span><b>${esc(l.by)}</b> — ${esc(l.what)}: ${esc(l.detail)}</span></div>`).join('')
     :'<div class="small">Nothing recorded yet. Every attachment, link and removal from the claim lands here with the person and the time.</div>'}`);
};

 const breach=BUDGET.filter(b=>b.q1p&&Math.abs((b.q1a-b.q1p)/b.q1p)>0.10);

       ${costFlags(c).filter(x=>x.sev==='red').map(x=>`<div class="flagline red"><span>✕</span><span>${esc(x.m)}</span></div>`).join('')}</span>
      <span class="mono" style="font-weight:700">${eur(c.a)}</span></div>`).join('')
     ||'<div class="flagline green"><span>✓</span><span>No blocking gaps. Every declared cost carries its evidence and an output.</span></div>'}
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
     <button class="btn ghost" onclick="go('collect','costs')">Open the cost lines</button>
     <button class="btn" onclick="auditPack()">Assemble the audit pack</button></div>`)
  +panel(`<h2>Audit trail</h2>${LEDGER.length?LEDGER.map(l=>`<div class="flagline"><span class="mono small">${l.at}</span>
     <span><b>${esc(l.by)}</b> — ${esc(l.what)}: ${esc(l.detail)}</span></div>`).join('')
   :'<div class="small">Empty. Every change to a figure or a document after submission is recorded here with the person and the time.</div>'}`);

function explainDeviation(h,v){

function setNarr(id,v){const s=findSec(id);if(!s)return;s.v=v;clearTimeout(NARRATIVE._t);

function recheck(id){
 const s=findSec(id);if(!s||s.approved)return;
 const v=(s.v||'').trim();let f=s.flags.filter(x=>!x.content);
 const solid=v.length>=60&&v.split(/\s+/).filter(Boolean).length>=12;
 if(!v)f.unshift({s:'red',content:true,m:'Empty — this section is required by the donor.'});
 else if(!solid)f.unshift({s:'amber',content:true,m:'Reads thin — add specifics, figures and the evidence behind them.'});
 if(id==='cc'&&v&&!/safeguard/i.test(v))f.unshift({s:'red',content:true,m:'Safeguarding subsection missing — mandatory.'});

}
function draftNarr(id){const s=findSec(id);if(!s)return;if(NARR_DRAFT[id])s.v=NARR_DRAFT[id];recheck(id);render();

function commentNarr(id){const t=prompt('Comment on this section:');if(t==null||!t.trim())return;

function approveNarrSection(id){const s=findSec(id);if(!s)return;

function approveNarr(){
 if(NARRATIVE.sections.some(s=>s.flags.some(f=>f.s==='red'))){toast('Blocking flags remain — the queue on the left lists them.');return;}
 NARRATIVE.sections.forEach(s=>{s.approved=true;s.flags=[];});NARRATIVE.status='approved';render();
 toast('Narrative approved and locked into the record.');}

  +panel(`<h2>This quarter’s open question</h2><div id="plqbox">${plqRows()}</div>

    <button class="btn sm" onclick="learningDoc()">Generate the learning document</button></div>`);
};
function lqRows(){return LQS.map((q,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
 <span class="mono small" style="width:26px">LQ${i+1}</span><input class="field" style="flex:1" value="${esc(q)}" oninput="LQS[${i}]=this.value"/>
 <button class="handle" onclick="delLQ(${i})">✕</button></div>`).join('');}
function refreshLQ(){const b=document.getElementById('lqbox');if(b)b.innerHTML=lqRows();}
function addLQ(){LQS.push('New learning question');refreshLQ();}
function delLQ(i){LQS.splice(i,1);refreshLQ();}
function plqRows(){return PLQ.map((q,i)=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">
 <span class="mono small" style="width:26px">Q${i+1}</span><input class="field" style="flex:1" value="${esc(q)}" oninput="PLQ[${i}]=this.value"/>
 <button class="handle" onclick="delPLQ(${i})">✕</button></div>`).join('');}
function refreshPLQ(){const b=document.getElementById('plqbox');if(b)b.innerHTML=plqRows();}
function addPLQ(){PLQ.push('New question');refreshPLQ();}
function delPLQ(i){PLQ.splice(i,1);refreshPLQ();}
function learningDoc(){modal(`<b>Q1 learning document (generated)</b>
 <div class="small" style="margin:4px 0 9px">Demo preview. In the live product this compiles a formatted document for Word, PDF or your connected drive.</div>
 <div class="doc-body">Q1 LEARNING DOCUMENT — COLD CHAIN FOR RURAL CLINICS

LQ1 — Sustaining equipment.
Clinics with a maintenance visit inside 60 days show 34% fewer failures; 11 of 18 teams operating.
Action: stand up the remaining seven teams in the northern districts.

LQ2 — Confidence in the cold chain.
Confidence tracks visible alarm response rather than training hours (early signal).
Action: publish per-district alarm response times against confidence scores.

LQ3 — Inclusive feedback.
86% response rate, but only 34% of feedback from women and health workers with disability against a 40% floor.
Action: supervised drop-in desks and a voice channel; review in six weeks.</div>`,'700px');}

/* ============================ FUNDING =================================== */
VIEW.funding=function(){
 const fit=S.curFit;
 return head('Funding','What this consortium’s delivery record already qualifies it for — matched on evidence, not keywords.')
  +panel(`<h2>Open calls</h2>${OPPS.map((o,i)=>`<div class="item" style="display:flex;gap:12px;align-items:flex-start;margin-top:9px">
    <div style="width:52px;flex:none;text-align:center">
      <div style="font-family:var(--serif);font-size:20px;color:${o.fit>85?'var(--good)':o.fit>70?'var(--warn)':'var(--muted)'}">${o.fit}%</div>
      <div class="lbl" style="font-size:8px">fit</div></div>
    <div style="flex:1;min-width:0"><b style="font-size:13px">${esc(o.t)}</b>
      <div class="small">${esc(o.donor)} · closes ${esc(o.deadline)}</div>
      <div class="chiprow" style="margin-top:6px">${o.why.map(w=>`<span class="tag good">${esc(w)}</span>`).join('')}
       ${o.gap?`<span class="tag warn">gap: ${esc(o.gap)}</span>`:''}</div></div>
    <button class="btn ghost sm" onclick="addPipeline(${i})">Track</button></div>`).join('')}
   ${PIPELINE.length?`<div style="margin-top:12px"><div class="lbl">Tracked</div>
     <div class="chiprow" style="margin-top:6px">${PIPELINE.map(p=>`<span class="tag acc">${esc(p)}</span>`).join('')}</div></div>`:''}`)
  +panel(`<h2>Draft proposal review</h2>${!S.propReviewed
   ?`<div class="small">Vizier reads a draft against the call and against what this consortium can actually evidence.</div>
     <div style="margin-top:10px"><button class="btn" onclick="reviewProposal()">Review our INTPA second-phase draft</button></div>`
   :`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div><div style="font-family:var(--serif);font-size:30px;color:${fit>85?'var(--good)':'var(--warn)'}">${fit}%</div><div class="lbl">fit against the call</div></div>
      <div class="bar" style="flex:1;min-width:160px"><i style="width:${fit}%"></i></div></div>
     <div class="grid g2" style="margin-top:14px">
      <div><div class="lbl">Evidenced strengths</div>${PROP_REVIEW.strengths.map(s=>`<div class="flagline green"><span>✓</span><span>${esc(s)}</span></div>`).join('')}</div>
      <div><div class="lbl">Gaps a reviewer will find</div>${PROP_REVIEW.gaps.map(s=>`<div class="flagline amber"><span>!</span><span>${esc(s)}</span></div>`).join('')}</div></div>
     <div style="margin-top:14px"><div class="lbl">What to attach</div>
      ${PROP_REVIEW.asks.map(a=>`<div class="item" style="display:flex;gap:10px;align-items:center;margin-top:7px">
       <span style="flex:1;font-size:13px">${esc(a)}</span><button class="btn ghost sm" onclick="attachProp()">Attach</button></div>`).join('')}</div>`}`);
};
function addPipeline(i){const o=OPPS[i];if(PIPELINE.includes(o.t))return;PIPELINE.push(o.t);render();
 toast('Tracking “'+o.t+'”. The deadline and the missing evidence now sit in your queue.');}
function reviewProposal(){toast('Reading the draft against the call and your delivery record…');
 setTimeout(()=>{S.propReviewed=true;S.curFit=PROP_REVIEW.fit;render();},700);}
function attachProp(){S.curFit=Math.min(89,S.curFit+5);render();toast('Attached — fit is now '+S.curFit+'%.');}

/* ============================ COMMAND BAR =============================== */
function ask(){
 const raw=(document.getElementById('cmd').value||'').trim();
 if(!raw)return;
 const q=raw.toLowerCase();
 const hit=QA.find(x=>{const w=x.q.toLowerCase().split(/\W+/).filter(t=>t.length>4);
  return w.filter(t=>q.includes(t)).length>=2;});
 drawer(`<div class="lbl">Question</div><div style="font-family:var(--serif);font-size:17px;margin:4px 0 14px">${esc(raw)}</div>
  <div class="small">Reading the returns, the framework and the budget…</div>`);
 setTimeout(()=>{
  drawer(`<div class="lbl">Question</div><div style="font-family:var(--serif);font-size:17px;margin:4px 0 14px">${esc(raw)}</div>
   ${hit?`<div style="font-size:13px">${hit.a}</div>
     <div class="chiprow" style="margin-top:12px">${hit.src.map(s=>src(s[0],s[1],'source')).join('')}</div>
     <div class="small" style="margin-top:10px">Answered from this programme’s own documents and returns. If the data is not there, Vizier says so instead of guessing.</div>`
    :`<div style="font-size:13px">Nothing in this programme answers that yet.</div>
      <div class="lbl" style="margin-top:14px">Try one of these</div>
      <div style="margin-top:6px">${QA.map(x=>`<button class="chip" style="display:block;text-align:left;margin-bottom:6px;width:100%" onclick="document.getElementById('cmd').value=this.textContent.trim();ask()">${esc(x.q)}</button>`).join('')}</div>`}`);
 },600);
}
function drawer(html){
 let d=document.getElementById('drawer');
 if(!d){d=document.createElement('div');d.id='drawer';document.body.appendChild(d);}
 d.innerHTML=localize(`<div style="display:flex;align-items:center;margin-bottom:14px"><span class="tag acc">Vizier</span><span style="flex:1"></span>
   <button class="tbtn" onclick="document.getElementById('drawer').remove()">Close</button></div>`+html);
}

/* ============================ TOUR / RESET ============================== */
const TOUR=[
 {ws:'sources',m:'Everything starts from the documents that already govern the programme. Vizier reads them and binds each donor rule to the field it will police.'},
 {ws:'framework',sub:'model',m:'This is what the donor demands: indicators, targets and six rules. Nothing here was typed by hand.'},
 {ws:'framework',sub:'template',m:'And this is what you collect — generated from those rules. Every field carries the obligation behind it.'},
 {ws:'collect',sub:'returns',m:'Partners file into it. Figures are checked as they are typed: missing disaggregation, a numerator above its denominator, two of their own sources disagreeing.'},
 {ws:'collect',sub:'costs',m:'Results are only half the report. These are the cost lines, checked against the reasons costs actually get declared ineligible: personnel time without a signed timesheet, procurement above the threshold without a comparison of offers, a cost nobody can tie to an output.'},
 {ws:'collect',sub:'review',m:'The reviewer gets checked returns with the judgement calls surfaced, comments on any line, approves, consolidates.'},
 {ws:'report',sub:'narrative',m:'The narrative is drafted from the same data, and flagged where it is thin, unevidenced or missing a mandatory subsection.'},
 {ws:'report',sub:'financial',m:'This is the number that costs real money: what would not survive an audit today, line by line, with the finding an auditor would write. Plus the trail of who changed what after submission.'},
 {ws:'report',sub:'consolidated',m:'And the hand-over. Donors take an encoded logframe in their own results system or a structured interim form — not a document — so Vizier assembles both from the approved figures and refuses to submit with an unmapped indicator.'},
 {ws:'signals',sub:'control',m:'The same data runs the control room — underspend and lagging indicators while you can still act. And the queue on the left is the whole product in one column: it always knows what needs you next.'},
];
let ti=-1;
function startTour(){ti=0;tourStep();}
function tourStep(){const s=TOUR[ti];go(s.ws,s.sub);
 const c=document.getElementById('coach');c.classList.remove('hidden');
 c.innerHTML=localize(`<div class="step">STEP ${ti+1} / ${TOUR.length}</div><div style="font-size:13px">${LANG==='ru'&&TOUR_RU[ti]?TOUR_RU[ti]:s.m}</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
   <button class="small" style="color:#8B90A0" onclick="endTour()">Skip</button>
   <button class="btn sm" onclick="nextStep()">${ti<TOUR.length-1?'Next':'Finish'}</button></div>`);}
const TOUR_RU=[
 'Всё начинается с документов, которые уже управляют программой. Vizier читает их и привязывает каждое правило донора к полю, которое оно будет контролировать.',
 'Вот что требует донор: показатели, цели и шесть правил. Ничего из этого не набрано руками.',
 'А вот что вы собираете — форма выведена из тех самых правил. Каждое поле несёт обязательство, ради которого существует.',
 'Партнёры заполняют её, а цифры проверяются прямо при вводе: нет дизагрегации, числитель больше знаменателя, два собственных источника партнёра расходятся между собой.',
 'Результаты — только половина отчёта. Это строки расходов, проверенные по тем причинам, по которым расходы реально признают неприемлемыми: время персонала без подписанного табеля, закупка выше порога без сравнения предложений, расход, который никто не может привязать к результату.',
 'Ревьюер получает проверенные отчёты с вынесенными наверх спорными местами, комментирует любую строку, одобряет и сводит.',
 'Текстовая часть собирается из тех же данных, и подсвечивается там, где пусто, бездоказательно или не хватает обязательного подраздела.',
 'Вот цифра, которая стоит настоящих денег: что не пережило бы аудит сегодня, построчно, с формулировкой, которую написал бы аудитор. И след того, кто что менял после сдачи.',
 'И передача. Донор принимает закодированную логфрейм-таблицу в своей системе результатов или структурированную промежуточную форму, а не документ. Vizier собирает обе из одобренных цифр и не даст сдать с несопоставленным показателем.',
 'Те же данные ведут пульт: недорасход и отстающие показатели видны, пока на них ещё можно повлиять. А очередь слева — весь продукт в одной колонке: она всегда знает, что нужно от вас дальше.',
];
function nextStep(){ti++;if(ti>=TOUR.length){endTour();return;}tourStep();}
function endTour(){document.getElementById('coach').classList.add('hidden');ti=-1;}

function resetDemo(){
 TPL=defaultTemplate();NARRATIVE=defaultNarr();SUB={};VERIFY={};COMMENTS={};APPROVED={};
 LQS=[...LEARNING_Q];PLQ=['How is the alarm-response routine landing with clinic staff?'];PIPELINE=[];
 COSTS=defaultCosts();LEDGER=[];MAPPING={'OP3.1':'CI-03','OP1.1':'CI-02','CC1':'CI-04','OP2.1':'','OC1.1':'','OP1.3':'','OC2.2':''};
 Object.assign(S,{persona:'lead',ws:'sources',sub:{},ingested:false,submitted:false,conflictDone:false,
  consolidated:false,reviewTarget:'',propReviewed:false,curFit:PROP_REVIEW.fit});
 ['lead','partner','mel'].forEach(x=>document.getElementById('p-'+x).classList.toggle('active',x==='lead'));
 const d=document.getElementById('drawer');if(d)d.remove();
 endTour();render();toast('Demo reset.');
}

/* ============================ BOOT ====================================== */
VIEW.collect=function(){return VIEW.returns();};
VIEW.framework=function(){return VIEW.model();};
VIEW.report=function(){return VIEW.narrative();};
VIEW.signals=function(){return VIEW.control();};
applyStaticLang();
document.getElementById('lang-'+LANG).classList.add('active');
render();
</script>
